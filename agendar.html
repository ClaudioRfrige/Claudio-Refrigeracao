<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agendar visita | Cláudio Refrigeração e Climatização</title>
<meta name="robots" content="noindex"><meta name="theme-color" content="#12235A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root{--navy:#12235A;--navy-d:#0B1B3D;--blue:#0096E2;--ink:#1B2430;--muted:#445063;--line:#E1E9F0;--paper:#F5F9FC}
*{box-sizing:border-box}body{margin:0;font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.5;color:var(--ink);background:var(--paper);min-height:100vh}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
header img{height:42px;width:auto}header a.back{color:var(--navy);font-weight:600;font-size:15px}
main{max-width:560px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic;font-weight:800;font-size:clamp(32px,8vw,42px);line-height:1.05;margin:0 0 6px;color:var(--navy)}
.lead{margin:0 0 18px;color:var(--muted)}
.prog{display:flex;gap:6px;margin-bottom:20px}.prog i{flex:1;height:6px;border-radius:4px;background:#D5E1EC}.prog i.on{background:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 10px 30px rgba(18,35,90,.08)}
h2{margin:0 0 14px;font-size:22px;color:var(--navy)}
.opts{display:grid;gap:10px}.opts.g2{grid-template-columns:1fr 1fr}.opts.g3{grid-template-columns:1fr 1fr 1fr}
.opt{font:inherit;font-weight:600;text-align:left;padding:15px 16px;min-height:54px;border:1.5px solid #C9D6E2;border-radius:14px;background:#F4F9FD;color:var(--ink);cursor:pointer}
.opts.g2 .opt,.opts.g3 .opt{text-align:center;padding:12px 6px}
.opt:hover,.opt:focus-visible{border-color:var(--blue);background:#EAF6FE;outline:none}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13.5px}
.back2{margin-top:16px;background:none;border:0;font:inherit;font-weight:600;color:var(--navy);cursor:pointer;min-height:44px;padding:0}
.sum{background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15.5px}
.fld{display:grid;gap:6px;margin-bottom:12px;font-weight:700;font-size:15px}
.fld input,.fld textarea{font:inherit;font-weight:500;padding:13px 14px;border:1.5px solid #C9D6E2;border-radius:12px;background:#F4F9FD;color:var(--ink);min-height:50px;width:100%}
.fld textarea{min-height:76px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:32px;font:inherit;font-weight:700;font-size:17px;color:#fff;background:#25D366;cursor:pointer;text-decoration:none;padding:12px}
.btn.blue{background:var(--blue)}
.err{color:#B3261E;font-size:15px;margin:0 0 10px;min-height:0}
.ok{text-align:center}.ok .ck{width:62px;height:62px;border-radius:50%;background:#25D366;color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.note{font-size:14.5px;color:var(--muted);margin:12px 0 0;text-align:center}
.hp{position:absolute;left:-9999px}
:focus-visible{outline:3px solid #4FC3F7;outline-offset:2px}
</style></head><body>

<main>
<h1>Agende sua visita</h1><p class="lead">Escolha o serviço, o dia e o horário. Leva menos de 1 minuto.</p>
<div class="prog" id="prog"><i></i><i></i><i></i><i></i></div>
<div class="card" id="box"></div>
</main>
<script>
(function(){
/* ===== CONFIGURAÇÃO ===== */
var API='https://script.google.com/macros/s/AKfycbxW3EAkOSoLzKlyQNnFCOhNRiwC_LYeTq28ayp7g1GrHQdff4OgmQ5pVlijVPj0Fqjq/exec';                                // link do Apps Script (veja o passo a passo)
var EMAIL='COLOQUE_O_EMAIL_AQUI';          // e-mail do Cláudio que recebe os pedidos
var WHATS='5598987733911';
var HORARIOS=['08:00','09:00','10:00','11:00','13:30','14:30','15:30'];
var NAO_ATENDE=[0];                         // 0 = domingo, 6 = sábado (tire o 0 se atende domingo)
var DIAS_A_FRENTE=21;                       // quantos dias aparecem
var SERVICOS=['Instalação de ar-condicionado','Limpeza e higienização','Manutenção preventiva','Conserto (não gela, pinga, faz barulho)','Desinstalação ou mudança de local','Compra e instalação de aparelho'];
/* ======================== */
var box=document.getElementById('box'),bars=document.querySelectorAll('#prog i'),st={occ:{}};
var SEM=['dom','seg','ter','qua','qui','sex','sáb'],SEMF=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'],MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function bar(n){bars.forEach(function(b,i){b.className=i<n?'on':''})}
function days(){var o=[],d=new Date();d.setHours(12,0,0,0);for(var i=1;o.length<DIAS_A_FRENTE&&i<60;i++){var x=new Date(d);x.setDate(d.getDate()+i);if(NAO_ATENDE.indexOf(x.getDay())<0)o.push(x)}return o}
function lbl(x){return SEMF[x.getDay()]+', '+x.getDate()+' de '+MES[x.getMonth()]}
function back(n){return '<button class="back2" type="button" data-b="'+n+'">&#8592; Voltar</button>'}
function s1(){bar(1);box.innerHTML='<h2>1. Qual serviço você precisa?</h2><div class="opts">'+SERVICOS.map(function(t,i){return '<button class="opt" type="button" data-s="'+i+'">'+t+'</button>'}).join('')+'</div>'}
function s2(){bar(2);box.innerHTML='<h2>2. Escolha o dia</h2><div class="opts g3">'+days().map(function(x,i){return '<button class="opt" type="button" data-d="'+i+'">'+SEM[x.getDay()]+'<small>'+x.getDate()+' '+MES[x.getMonth()]+'</small></button>'}).join('')+'</div>'+back(1)}
function s3(){bar(3);box.innerHTML='<h2>3. Escolha o horário</h2><p class="lead" style="margin:-6px 0 12px">'+esc(st.dia)+'</p><div class="opts g3">'+HORARIOS.map(function(h){var oc=st.occ[st.iso+' '+h];return '<button class="opt" type="button" data-h="'+h+'"'+(oc?' disabled style="opacity:.4;text-decoration:line-through"':'')+'>'+h+(oc?'<small>ocupado</small>':'')+'</button>'}).join('')+'</div>'+back(2)}
function s4(){bar(4);box.innerHTML='<h2>4. Seus dados</h2><div class="sum"><b>'+esc(st.sv)+'</b><br>'+esc(st.dia)+' às '+st.hr+'</div><form id="f" novalidate>'+
'<label class="fld">Seu nome<input name="nome" autocomplete="name" required></label>'+
'<label class="fld">Seu WhatsApp (com DDD)<input name="zap" type="tel" inputmode="tel" autocomplete="tel" placeholder="(98) 9 0000-0000" required></label>'+
'<label class="fld">Bairro e cidade<input name="local" autocomplete="address-level2" placeholder="Ex.: Maiobão, Paço do Lumiar" required></label>'+
'<label class="fld">Conte mais (opcional)<textarea name="obs" placeholder="Modelo do aparelho, BTU ou o problema"></textarea></label>'+
'<label class="fld">E-mail (opcional, para receber a confirmação)<input name="mail" type="email" autocomplete="email"></label>'+
'<input class="hp" name="_honey" tabindex="-1" autocomplete="off"><p class="err" id="err" role="alert"></p>'+
'<button class="btn blue" type="submit" id="go">Pedir esta visita</button></form>'+back(3)}
function msg(){return 'Olá! Pedi uma visita pelo site.\nServiço: '+st.sv+'\nDia: '+st.dia+' às '+st.hr+'\nNome: '+st.nome+'\nBairro/cidade: '+st.local+(st.obs?'\nDetalhes: '+st.obs:'')}
function done(sent){bar(4);box.className='card ok';box.innerHTML='<div class="ck">&#10003;</div><h2>Pedido enviado!</h2><div class="sum" style="text-align:left"><b>'+esc(st.sv)+'</b><br>'+esc(st.dia)+' às '+st.hr+'<br>'+esc(st.local)+'</div>'+
(sent?'<p class="lead">O Cláudio recebeu o seu pedido e vai confirmar o horário com você.</p>':'<p class="lead">Não conseguimos enviar o aviso por e-mail. Toque no botão abaixo para mandar o pedido pelo WhatsApp.</p>')+
(st.id?'<p class="note">Código do pedido: <b>'+st.id+'</b><br><a href="?id='+st.id+'">Acompanhar meu pedido</a></p>':'')+'<a class="btn" style="margin-top:14px" target="_blank" rel="noopener" href="https://wa.me/'+WHATS+'?text='+encodeURIComponent(msg())+'">Confirmar também pelo WhatsApp</a><p class="note">O horário é confirmado pelo Cláudio. Se ele não puder nesse horário, vai sugerir outro.</p>'}
box.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
if(t.dataset.s!=null){st.sv=SERVICOS[+t.dataset.s];s2()}
else if(t.dataset.d!=null){st.dia=lbl(days()[+t.dataset.d]);st.iso=days()[+t.dataset.d].toISOString().slice(0,10);s3()}
else if(t.dataset.h){st.hr=t.dataset.h;s4()}
else if(t.dataset.b){[0,s1,s2,s3][+t.dataset.b]()}});
box.addEventListener('submit',function(e){e.preventDefault();var f=e.target,v=function(n){return f.elements[n].value.trim()},er=document.getElementById('err');
if(v('_honey'))return;
if(v('nome').length<2){er.textContent='Digite o seu nome.';return}
if(v('zap').replace(/\D/g,'').length<10){er.textContent='Digite o WhatsApp com DDD.';return}
if(v('local').length<3){er.textContent='Digite o bairro e a cidade.';return}
st.nome=v('nome');st.zap=v('zap');st.local=v('local');st.obs=v('obs');st.mail=v('mail');
var b=document.getElementById('go');b.disabled=true;b.textContent='Enviando...';
if(API){fetch(API,{method:'POST',body:JSON.stringify({acao:'criar',sv:st.sv,iso:st.iso,dia:st.dia,hr:st.hr,nome:st.nome,zap:st.zap,local:st.local,obs:st.obs,mail:st.mail})}).then(function(r){return r.json()}).then(function(j){if(j.ok){st.id=j.id;done(true)}else if(j.erro==='ocupado'){st.occ[st.iso+' '+st.hr]=1;s3();box.insertAdjacentHTML('afterbegin','<p class="err">Esse horário acabou de ser ocupado. Escolha outro.</p>')}else{done(false)}}).catch(function(){done(false)});return}
if(EMAIL.indexOf('@')<0){done(false);return}
fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:'Nova visita: '+st.sv+' - '+st.dia+' '+st.hr,_template:'table',_captcha:'false',Serviço:st.sv,Dia:st.dia+' ('+st.iso+')',Horário:st.hr,Nome:st.nome,WhatsApp:st.zap,'Bairro e cidade':st.local,Detalhes:st.obs||'-'})})
.then(function(r){return r.json()}).then(function(j){done(j&&(j.success==='true'||j.success===true))}).catch(function(){done(false)})});
function status(id){bar(4);box.innerHTML='<h2>Seu pedido</h2><p class="lead">Consultando...</p>';
fetch(API+'?acao=status&id='+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(j){var m={Pendente:'Aguardando a confirmação do Cláudio.',Confirmado:'Sua visita está confirmada!',Recusado:'O Cláudio não conseguiu esse horário e vai sugerir outro pelo WhatsApp.','Concluído':'Serviço concluído.',Cancelado:'Visita cancelada.'};
box.innerHTML=j.ok?'<h2>'+esc(j.status)+'</h2><div class="sum"><b>'+esc(j.sv)+'</b><br>'+esc(j.dia)+' às '+esc(j.hr)+'</div><p class="lead">'+(m[j.status]||'')+'</p><a class="btn blue" href="agendar.html">Novo agendamento</a>':'<h2>Pedido não encontrado</h2><a class="btn blue" href="agendar.html">Novo agendamento</a>'}).catch(function(){box.innerHTML='<h2>Não foi possível consultar agora.</h2>'})}
var qid=(location.search.match(/[?&]id=([A-Za-z0-9]+)/)||[])[1];
if(API){fetch(API+'?acao=ocupados').then(function(r){return r.json()}).then(function(j){if(j.ok)st.occ=j.ocupados||{}}).catch(function(){})}
if(API&&qid)status(qid);else s1();
})();
</script></body></html>
